name: Publish lab website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Locate the website
        id: source
        shell: bash
        run: |
          if test -f package.json; then
            echo 'directory=.' >> "$GITHUB_OUTPUT"
          elif test -f repo/package.json; then
            echo 'directory=repo' >> "$GITHUB_OUTPUT"
          else
            echo 'Cannot find the website package.json' >&2
            exit 1
          fi
      - name: Check content and build logic
        run: npm run check
        working-directory: ${{ steps.source.outputs.directory }}
      - name: Read GitHub Pages configuration
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5
        id: pages
      - name: Build for the actual Pages URL
        run: npm run build
        working-directory: ${{ steps.source.outputs.directory }}
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.source.outputs.directory }}/dist

  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
